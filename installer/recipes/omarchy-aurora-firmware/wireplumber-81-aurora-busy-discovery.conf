# Discover sound cards whose PCM is busy: speakersafetyd holds the J714 speaker card's V/I sense PCM
# open, and PipeWire's udev monitor otherwise skips the card (no speakers, no jack).
# From kazuhidet's J713 (Omarchy-M4-Native audio/j713 81-j713-busy-discovery.conf, e2a80c3c23).
monitor.alsa.properties = { alsa.udev.expose-busy = true }
