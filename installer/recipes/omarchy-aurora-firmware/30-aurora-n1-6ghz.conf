# Every Mac this image is for has the N1, so iwd loads the N1 default (6 GHz on)
# in place of omarchy-mac's Apple one (6 GHz off for the BCM4388). This sorts
# after omarchy-mac's 20-omarchy-mac.conf, whose list it replaces; an
# /etc/iwd/main.conf still wins. From edimoldovan/omarchy-mac-pkgs 702a6ec363.
[Service]
Environment=CONFIGURATION_DIRECTORY=/etc/iwd:/usr/lib/omarchy-aurora/iwd-n1
