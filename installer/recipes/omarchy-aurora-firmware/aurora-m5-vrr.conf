# The firmware 27 internal panel offers VRR (ProMotion, 24-120 Hz) to the compositor
# (rolotrealanis98's j716s-next 8ab10100a4, kernel patch 0014). It only advertises the range:
# the panel stays at a fixed rate unless the compositor turns VRR on (Hyprland misc:vrr).
# Stable on this J714s in 7 boots on the 27.3 firmware.
options appledrm fw27_panel_vrr=1
