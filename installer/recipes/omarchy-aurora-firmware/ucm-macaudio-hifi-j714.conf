# aurora-silicon/alsa-ucm-conf-asahi 96b3206 ucm2/conf.d/macaudio/laptops/HiFi.conf, unchanged: the J714
# profile includes it from here because alsa-ucm-conf-aurora 10.aurora3 predates its speakerguardd v2
# condition (4805553, #13).

# For laptops with 6 speakers (4 woofers and 2 tweeters)

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

If.cs42l84 {
	Condition {
		Type String
		String1 "${var:JackCodec}"
		String2 "cs42l84"
	}
	True {
		Include.hp.File "/conf.d/macaudio/cs42l84/Headphones.conf"
	}
}

If.cs42l83 {
	Condition {
		Type String
		String1 "${var:JackCodec}"
		String2 "cs42l83"
	}
	True {
		Include.hp.File "/conf.d/macaudio/cs42l83/Headphones.conf"
	}
}


If.havespk {
	Condition {
		Type ControlExists
		Control "name='${var:SpeakerElem}'"
	}
	True {
		# speakerguardd v2 owns the speaker PCM this boot (its provisioning
		# writes the marker before any session starts, beside the rules that
		# disable WirePlumber's node for this PCM): the speakers are its
		# voicing sink, so the card offers no Speaker device. Desktops would
		# otherwise list a second, dead "Speakers" port, and WirePlumber's
		# probe of the device would open the raw speaker PCM. The verb
		# (the mux) and the jack devices are unchanged; the Speaker Switch
		# is on from probe.
		If.sgv2 {
			Condition {
				Type Path
				Path "/run/speakerguardd-graph/speakerguardd-owns-speakers"
				Mode exists
			}
			False {
				SectionDevice."Speaker" {
					Comment "Speakers"

					EnableSequence [
						cset "name='Speaker Switch' on"
					]

					Value {
						PlaybackChannels "${var:PlaybackChannels}"
						PlaybackPriority 100
						PlaybackPCM "hw:${CardId},${var:SpeakerDevice}"
					}
				}
			}
		}
	}
}
