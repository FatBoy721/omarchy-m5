# omarchy-j714s: move the speakers to speakerguardd v2 on their own, at boot, once this Mac's
# own tuning passes v2's checks. This is upstream's documented opt-in for the boot unit
# (speakerguardd packaging/upgrade/README.md: ExecStart with --i-understand-preview); nothing
# else changes. The gate (gate.json, parity.json, the silent self-check and the switch test)
# decides: a refusal leaves the speakers where they are, held at the kernel's floor on the
# J714s, and is not retried until the kernel, speakerguardd or the parity attestation changes.
# Undo: systemctl disable aurora-speaker-upgrade; sudo aurora-speaker-upgrade --revert.
[Service]
# apfs_ro reads LZFSE-compressed System files through this (lzfse is not in Arch Linux ARM).
Environment=AURORA_LZFSE_LIB=/usr/lib/omarchy-aurora/liblzfse.so.1
ExecStart=
ExecStart=/usr/bin/aurora-speaker-upgrade run --at-boot --i-understand-preview
