# From edimoldovan/omarchy-mac-pkgs rt-uclamp 74d8f8bbef (J714c: P-cluster top-speed share 30-40 % -> 0 % at idle).
# schedutil runs a CPU cluster at its top speed whenever a realtime thread runs. PipeWire's data loops are realtime
# and the speaker sink stays open (asahi-audio-no-suspend.conf), so an idle Mac keeps its performance clusters at top
# speed much of the time. 0 lets realtime threads keep their priority without forcing the top speed.
kernel.sched_util_clamp_min_rt_default = 0
