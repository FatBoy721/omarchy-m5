# Order fprintd after the Secure Enclave loader when the owner has enabled it.
#
# Upstream's fprintd-aurora.conf has Requires=aurora-sep.service, so any
# fprintd start (D-Bus activation by a lock screen, sudo or polkit) would load
# the driver even with aurora-sep.service disabled, and its ExecCondition
# would keep fprintd from starting at all while the driver is not loaded (a
# USB reader too). On this image the driver loads only once the owner enables
# aurora-sep.service, so this only orders. libfprint-aurora's own drop-in
# lets fprintd open /dev/sep-bio.
[Unit]
After=aurora-sep.service aurora-sep-ready.service
