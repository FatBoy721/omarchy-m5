# The J714s developer image keeps the Secure Enclave driver read-only.
#
# apple_sep defaults to xart_writes=1 provision_keybag=1: loaded with its
# defaults it creates Linux's identity keybag by writing the xART store in the
# iBoot System Container, which macOS shares. This file turns both off, so a
# load (by hand, by aurora-sep.service or by anything else) attaches without
# writing enclave or xART state.
#
# To opt in to Touch ID, the owner replaces this file with one of the same name
# in /etc/modprobe.d (a file there replaces this one outright); see
# /usr/share/doc/aurora-sep/README.omarchy-m5.md. Deleting that copy and
# rebooting goes back to read-only.
options apple_sep xart_writes=0 provision_keybag=0
