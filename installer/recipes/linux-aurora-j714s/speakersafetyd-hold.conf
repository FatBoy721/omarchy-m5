# linux-aurora (aurora-silicon base): keep the J714s speakers under the kernel's lock.
#
# This kernel's J714s speaker card (aurora-silicon #1554) is guarded upstream by speakerguardd v2
# with each Mac's own tuning, which is not public yet. The image's speakersafetyd profile
# (/usr/share/speakersafetyd/apple/j714.conf) was measured against the other kernel's device tree;
# its sense slots and scales are not checked against this one. Until they are, speakersafetyd
# does not take the J714 speakers here, so they stay silent (headphones and microphones are not
# affected). Other Macs are untouched.
[Service]
ExecCondition=/bin/sh -c '! tr "\\000" "\\n" < /proc/device-tree/compatible | grep -Eqx "apple,j714[sc]?"'
