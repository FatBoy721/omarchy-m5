# m5 PLATFORM stage 1 (first SMC-children boot): keep native access and reboot stable.
# The new SMC lid/power-button input (macsmc-input) and eDP must not trigger logind actions until the
# DWC3 gadget (usb0 SSH/serial) resume path is verified. Remove this file only at the reviewed stage 3.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
